# /etc/nginx/sites-available/hirestaffislamabad.pk
# Certbot adds the HTTPS (443) blocks and redirects automatically.
upstream hirestaffislamabad { server 127.0.0.1:3010; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name hirestaffislamabad.pk www.hirestaffislamabad.pk;

    # Canonical host: www → apex
    if ($host = www.hirestaffislamabad.pk) { return 301 https://hirestaffislamabad.pk$request_uri; }

    client_max_body_size 5m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location /_next/static/ {
        proxy_pass http://hirestaffislamabad;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://hirestaffislamabad;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
